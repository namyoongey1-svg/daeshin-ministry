name: 마나 게임 홍보글

# 로블록스 게임 "마나 수집 시뮬레이터" 홍보 글을 스레드에 올린다.
#
# 청빙공고 수집(scrape.yml)과 **일부러 분리했다.** 수집이 실패한 날에도 홍보는
# 올라가야 하고, 둘을 엮으면 한쪽 고장이 다른 쪽을 멈춘다.
#
# 묶음이 둘이다.
#   ko — 기존 전도사 계정. 청빙공고와 같은 계정이라 토큰을 새로 넣을 필요가 없다.
#        주일학교 교사·학부모가 보는 글이다.
#   en — 게임용 새 계정. MANNA_THREADS_ACCESS_TOKEN 이 없으면 스스로 건너뛴다.
#
# 주 3회만 도는 이유: 같은 계정에서 청빙 글이 매일 아침 올라간다. 거기에 홍보까지
# 매일 얹으면 계정이 절반쯤 광고가 된다. 월·수·금이면 청빙 글을 밀어내지 않는다.

on:
  schedule:
    # 월·수·금 11:00 UTC = 20:00 KST. 저녁에 교사·학부모가 가장 많이 본다.
    - cron: "0 11 * * 1,3,5"
  workflow_dispatch:
    inputs:
      pack:
        description: "올릴 묶음"
        type: choice
        options: [ko, en, both]
        default: ko
      dry:
        description: "올리지 않고 글만 확인"
        type: boolean
        default: true

# 같은 글이 두 번 올라가지 않게 한 번에 하나만 돈다.
concurrency:
  group: manna-threads
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://pkjmvceeafeekhxxexcn.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # ko 는 청빙공고와 같은 계정이라 이미 들어 있는 토큰을 그대로 쓴다.
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      # en 은 게임용 새 계정. 없으면 그 단계만 조용히 건너뛴다.
      MANNA_THREADS_ACCESS_TOKEN: ${{ secrets.MANNA_THREADS_ACCESS_TOKEN }}
      # 예약 실행일 때는 inputs 가 비어 있다. 그때의 기본값을 여기서 정한다.
      PACK: ${{ inputs.pack || 'ko' }}
      DRY: ${{ inputs.dry || 'false' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 글 길이부터 본다. 500자를 넘는 글이 하나라도 있으면 여기서 멈춘다.
      - name: 글 묶음 검사
        run: npm run manna-threads -- --all

      - name: 한국어 글
        if: env.PACK == 'ko' || env.PACK == 'both'
        run: |
          if [ "$DRY" = "true" ]; then
            npm run manna-threads -- --pack ko --dry
          else
            npm run manna-threads -- --pack ko
          fi

      # 토큰이 없으면 스크립트가 스스로 건너뛰므로, 계정을 아직 안 만들었어도
      # 이 단계가 빨갛게 되지 않는다.
      - name: 영어 글
        if: env.PACK == 'en' || env.PACK == 'both'
        run: |
          if [ "$DRY" = "true" ]; then
            npm run manna-threads -- --pack en --dry
          else
            npm run manna-threads -- --pack en
          fi
